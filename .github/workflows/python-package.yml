name: tests

permissions:
  contents: read
  
on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Add conda to system path
      run: |
        echo $CONDA/bin >> $GITHUB_PATH
    - name: Install care
      run: |
        conda create -n care_test python=3.12
        source $CONDA/etc/profile.d/conda.sh
        conda activate care_test
        pip install torch==2.4.0
        pip install torch-scatter torch-sparse -f https://data.pyg.org/whl/torch-2.4.0+cpu.html
        pip install .[mace]
        pip install .[fairchemv1]
        pip install .[petmad]
        pip install .[orb]
        pip install .[gamenetuq]
        pip install coverage codecov
    - name: Install Julia 1.11 and dependencies
      uses: julia-actions/setup-julia@v1
      with:
        version: '1.11'
    - name: Install Julia dependencies
      run: |
        source $CONDA/etc/profile.d/conda.sh
        conda activate care_test
        julia -e 'import Pkg; Pkg.add("DifferentialEquations"); Pkg.add("LinearSolve");'
    - name: Lint with flake8
      run: |
        source $CONDA/etc/profile.d/conda.sh
        conda activate care_test
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest and generate coverage
      run: |
        source $CONDA/etc/profile.d/conda.sh
        conda activate care_test
        pip install pytest pytest-cov
        pytest --cov --cov-branch --cov-report=xml
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
