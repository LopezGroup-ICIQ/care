name: tests

permissions:
  contents: read
  
on: 
  push:
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'docs/**'
      - 'notebooks/care_demo.ipynb'
      - 'notebooks/adsorbate_placement.py'
      - '**/*.md'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
      fail-fast: true
      matrix:
        python-version: ['3.12', '3.13']

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        
    - name: Install care and test dependencies
      env:
          CXXFLAGS: "-include cstdint" 
      run: |
        python -m pip install --upgrade pip
        pip install .[fairchemv2]
        pip install .[mace]
        pip install .[gamenetuq]
        pip install .[orb]
        pip install coverage codecov flake8 pytest pytest-cov
        
    - name: Install Julia 1.11
      uses: julia-actions/setup-julia@v3
      with:
        version: '1.11'
        
    - name: Cache Julia environment
      uses: julia-actions/cache@v2
        
    - name: Resolve Julia dependencies
      run: |
        python -c "import juliapkg; juliapkg.resolve()"
        
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: pytest
      env:
        MP_API_KEY: ${{ secrets.MP_API_KEY }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        PYTHONPATH: .
      run: |
        pytest --cov --cov-branch --cov-report=xml
        
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}