name: tests

permissions:
  contents: read
  
on: 
  push:
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'docs/**'
      - 'notebooks/care_demo.ipynb'
      - 'notebooks/adsorbate_placement.py'
      - '**/*.md'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
      matrix:
        python-version: ['3.12', '3.13']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Add conda to system path
      run: |
        echo $CONDA/bin >> $GITHUB_PATH
        
    - name: Install care
      run: |
        conda create -n care_test python=${{ matrix.python-version }} -y 
        source $CONDA/etc/profile.d/conda.sh
        conda activate care_test
        pip install .[fairchemv2]
        pip install .[mace]
        pip install .[gamenetuq]
        pip install .[orb]
        pip install coverage codecov
        
    - name: Install Julia 1.11 and dependencies
      uses: julia-actions/setup-julia@v2
      with:
        version: '1.11'
        
    - name: Resolve Julia dependencies
      run: |
        source $CONDA/etc/profile.d/conda.sh
        conda activate care_test
        python -c "import juliapkg; juliapkg.resolve()"
        
    - name: Lint with flake8
      run: |
        source $CONDA/etc/profile.d/conda.sh
        conda activate care_test
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: pytest
      env:
        MP_API_KEY: ${{ secrets.MP_API_KEY }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        PYTHONPATH: .
      run: |
        source $CONDA/etc/profile.d/conda.sh
        conda activate care_test
        pip install pytest pytest-cov
        pytest --cov --cov-branch --cov-report=xml
        
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
