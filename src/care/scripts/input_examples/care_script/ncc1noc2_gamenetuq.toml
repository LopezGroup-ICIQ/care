[chemspace]
ncc = 1 # Network Carbon Cutoff (int)
noc = 2  # Network Oxygen Cutoff (int, if <0, maximum O saturation)
regen = true #Force the re-generatation of the existing CRN (bool)
additional = true #Include 1.2-H shifts (bool)
electro = false #ochemical process, readjusts the reaction expressions accordingly (bool)
cyclic = false

[surface]
metal = "Fe" # Metal catalyst (str)
hkl = "110" # Surface facet, fcc/bcc metals: "111", "110" "100"; hcp metals: "0001", "10m10","10m11" (str)

[evaluator]
model = "gamenetuq"  # available are ocp, mace, and gamenetuq
use_uq = false # Criterion for GAME-Net-UQ: if True, selects best configurations based on uncertainty (s), else based on lowest energy (mu)
num_configs = 3 # Number of initial adsorption configurations per adsorbate/surface pair
