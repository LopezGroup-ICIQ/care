[surface]
metal = "Ru" # metal catalyst (str)
hkl = "10m11" # Surface facet, fcc/bcc metals: "111", "110" "100"; hcp metals: "0001", "10m10","10m11" (str)

[evaluator]
model = "gamenetuq"  # available are gamenetuq, ocp, mace
use_uq = false # Criterion for GAME-Net-UQ: if True, selects best configurations based on uncertainty (std), else based on lowest energy (mu)
num_configs = 3 # Number of adsorption configurations per adsorbate-surface pair to screen
